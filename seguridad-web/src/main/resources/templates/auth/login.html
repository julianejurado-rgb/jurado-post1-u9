<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
  <h1>Iniciar Sesión</h1>
  <!-- Spring Security procesa el POST a /login automáticamente -->
  <form th:action="@{/login}" method="post">
    <div th:if="${param.error}" class="error">
      Correo o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}" class="ok">Sesión cerrada correctamente.</div>
    <div th:if="${param.registrado}" class="ok">Registro exitoso. Inicie sesión.</div>
    <label>Correo: <input type="email" name="username" required /></label>
    <label>Contraseña: <input type="password" name="password" required /></label>
    <!-- Thymeleaf + Spring Security incluye el token CSRF automáticamente -->
    <button type="submit">Ingresar</button>
  </form>
  <p><a th:href="@{/registro}">¿No tiene cuenta? Registrarse</a></p>
</body>
</html>
