spring.application.name=seguridad
server.port=8080

# MySQL. Los valores por defecto sirven para desarrollo local; en otro
# entorno se sobrescriben con las variables DB_URL, DB_USERNAME y DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/seguridad_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
